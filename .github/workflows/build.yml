name: Build and Deploy Docker Image

on:
  push:

  delete:

  workflow_dispatch:

# Normalize the branch name across push and delete events so deleting a merged
# branch cancels its in-flight preview deploy before cleanup runs.
concurrency:
  group: nimbus-cityio-backend-${{ github.event_name == 'delete' && github.event.ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'delete' }}

jobs:
  build-and-deploy:
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest
    env:
      KO_DOCKER_REPO: docker.prayujt.com/cityio-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        id: go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Go modules and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-ko-${{ github.workflow }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ko-${{ github.workflow }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            ${{ runner.os }}-${{ runner.arch }}-ko-${{ github.workflow }}-${{ steps.go.outputs.go-version }}-

      - name: Set up ko
        uses: ko-build/setup-ko@v0.9
        with:
          version: v0.19.1

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: docker.prayujt.com
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image with ko
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: ko build ./cmd --bare --platform=linux/amd64,linux/arm64 --tags="$IMAGE_TAG,latest"

      - name: Deploy
        uses: rayman-tech/nimbus-action@v2
        with:
          api-key: ${{ secrets.NIMBUS_API_KEY }}
          nimbus-server: https://nimbus.prayujt.com
          nimbus-path: nimbus.yaml

  cleanup:
    if: github.event_name == 'delete'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Cleanup branch preview
        uses: rayman-tech/nimbus-action@v2
        with:
          api-key: ${{ secrets.NIMBUS_API_KEY }}
          nimbus-server: https://nimbus.prayujt.com
          nimbus-path: nimbus.yaml
